[project]
name = "polymarket-agent"
version = "0.1.0"
description = "Polymarket 事件驱动候选单系统 —— 研究/候选单/风控/仓位管理/执行/监控/报告"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Trade Agent Team" }]

dependencies = [
    # ---------- Web ----------
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.29,<1",

    # ---------- 数据库 ----------
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "psycopg2-binary>=2.9,<3",

    # ---------- 校验 / 序列化 ----------
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",

    # ---------- 缓存 / 消息 ----------
    "redis>=5.0,<6",

    # ---------- HTTP ----------
    "httpx>=0.27,<1",

    # ---------- 配置 ----------
    "pyyaml>=6.0,<7",

    # ---------- 日志 ----------
    "structlog>=24.1,<25",

    # ---------- Polymarket SDK (预留) ----------
    # "py-clob-client>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "httpx>=0.27,<1",
    "ruff>=0.4,<1",
    "mypy>=1.9,<2",
    "pre-commit>=3.7,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "libs"]

# ---------- Ruff ----------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

# ---------- Pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "replay: 回放测试",
]

# ---------- MyPy ----------
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
